name: OSV Scanner

# Scan pnpm-lock.yaml for known vulnerabilities.
# - Daily cron catches newly disclosed CVEs in existing deps.
# - Push trigger re-scans when the lockfile changes on main.
on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --lockfile=pnpm-lock.yaml
        continue-on-error: true

      - name: Run osv-scanner-reporter
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5
