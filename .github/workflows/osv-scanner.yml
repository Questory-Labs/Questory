name: OSV Scanner

# Scan pnpm-lock.yaml for known vulnerabilities.
# - Daily cron catches newly disclosed CVEs in existing deps.
# - Push trigger re-scans when the lockfile changes on main.
on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
