name: Canary Release

# Builds rolling :canary images for api and web from main.
# Pushes lightweight git tags for semver canary numbering (no GitHub Release).
#
# Triggers:
#   - Push to main (cancels in-progress runs)
#   - Daily schedule (06:00 UTC)
#   - Manual: Actions → Canary Release → Run workflow
on:
  push:
    branches:
      - main

concurrency:
  group: canary-release
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Resolve canary version
    runs-on: self-hosted
    outputs:
      version_api: ${{ steps.version.outputs.version_api }}
      version_web: ${{ steps.version.outputs.version_web }}
      docker_tag_api: ${{ steps.version.outputs.docker_tag_api }}
      docker_tag_web: ${{ steps.version.outputs.docker_tag_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Resolve canary version
        id: version
        run: node scripts/release-version.mjs canary --github-output

  docker-api:
    name: Canary api
    needs: meta
    uses: ./.github/workflows/docker-release.yml
    with:
      release_tag: ${{ needs.meta.outputs.docker_tag_api }}
      channel_override: canary
      skip_github_release: true
    secrets: inherit

  docker-web:
    name: Canary web
    needs: meta
    uses: ./.github/workflows/docker-release.yml
    with:
      release_tag: ${{ needs.meta.outputs.docker_tag_web }}
      channel_override: canary
      skip_github_release: true
    secrets: inherit

  tag:
    name: Push canary git tags
    needs: [meta, docker-api, docker-web]
    runs-on: self-hosted
    if: needs.docker-api.result == 'success' && needs.docker-web.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create and push git tags
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.meta.outputs.docker_tag_api }}"
          git tag "${{ needs.meta.outputs.docker_tag_web }}"
          git push origin "${{ needs.meta.outputs.docker_tag_api }}" "${{ needs.meta.outputs.docker_tag_web }}"

  summary:
    name: Canary summary
    needs: [meta, docker-api, docker-web, tag]
    runs-on: self-hosted
    if: always() && needs.meta.result == 'success'
    steps:
      - name: Write summary
        run: |
          {
            echo "## Canary release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| API version | \`${{ needs.meta.outputs.version_api }}\` |"
            echo "| Web version | \`${{ needs.meta.outputs.version_web }}\` |"
            echo "| API job | ${{ needs.docker-api.result }} |"
            echo "| Web job | ${{ needs.docker-web.result }} |"
            echo "| Git tags | ${{ needs.tag.result }} |"
            echo ""
            echo "Pull channel tags:"
            echo ""
            echo '```bash'
            echo "docker pull santoshpanna/questorylabs-api:canary"
            echo "docker pull santoshpanna/questorylabs-web:canary"
            echo "docker pull ghcr.io/questory-labs/questorylabs-api:canary"
            echo "docker pull ghcr.io/questory-labs/questorylabs-web:canary"
            echo '```'
            echo ""
            echo "Pin this build:"
            echo ""
            echo '```bash'
            echo "docker pull santoshpanna/questorylabs-api:${{ needs.meta.outputs.version_api }}"
            echo "docker pull santoshpanna/questorylabs-web:${{ needs.meta.outputs.version_web }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a release job failed
        if: needs.docker-api.result != 'success' || needs.docker-web.result != 'success' || needs.tag.result == 'failure'
        run: exit 1
