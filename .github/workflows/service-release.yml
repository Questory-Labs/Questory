name: Service Release

# Deploys / releases a service using an already-published Docker image.
#
# Triggers:
#   - Push tag: service-api-1.0.0, service-web-1.2.3 (version must match a prior docker-* release)
#   - Manual: Actions → Service Release → Run workflow (service + version)
on:
  push:
    tags:
      - "service-api-*"
      - "service-web-*"
  workflow_dispatch:
    inputs:
      service:
        description: Service to release (Docker image must already exist)
        required: true
        type: choice
        options:
          - api
          - web
      version:
        description: Release version (semver, e.g. 1.2.3)
        required: true
        type: string

concurrency:
  group: service-release-${{ github.event_name == 'workflow_dispatch' && format('service-{0}-{1}', github.event.inputs.service, github.event.inputs.version) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOCKERHUB_NAMESPACE: santoshpanna
  DOCKER_IMAGE_PREFIX: questorylabs

jobs:
  release:
    name: Release service from Docker image
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            version="${version#v}"
            tag="service-${{ github.event.inputs.service }}-${version}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Parse tag
        id: meta
        run: node scripts/ci-parse-tag.mjs "${{ steps.tag.outputs.tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify image exists
        run: |
          set -euo pipefail
          echo "Pulling ${{ steps.meta.outputs.image_tag }}"
          docker pull "${{ steps.meta.outputs.image_tag }}"
          echo "Also available as latest:"
          docker pull "${{ steps.meta.outputs.image_latest }}" || true
          docker image inspect "${{ steps.meta.outputs.image_tag }}" --format '{{.Id}} {{.RepoTags}}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Service ${{ steps.meta.outputs.service }} ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          body: |
            ## Service release

            Uses the published Docker image (no rebuild).

            | | |
            |---|---|
            | Service | `${{ steps.meta.outputs.service }}` |
            | Version | `${{ steps.meta.outputs.version }}` |
            | Image | `${{ steps.meta.outputs.image_tag }}` |

            ### Compose deploy

            ```bash
            export IMAGE_TAG=${{ steps.meta.outputs.version }}
            docker compose --profile selfhosted-full pull ${{ steps.meta.outputs.service }}
            docker compose --profile selfhosted-full up -d ${{ steps.meta.outputs.service }}
            ```

            For lite (`api` → `api-lite`):
            ```bash
            export IMAGE_TAG=${{ steps.meta.outputs.version }}
            docker compose --profile selfhosted pull api-lite
            docker compose --profile selfhosted up -d api-lite
            ```

  deploy:
    name: Remote deploy
    needs: release
    runs-on: self-hosted
    if: ${{ vars.ENABLE_SERVICE_DEPLOY == 'true' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            version="${version#v}"
            tag="service-${{ github.event.inputs.service }}-${version}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Parse tag
        id: meta
        run: node scripts/ci-parse-tag.mjs "${{ steps.tag.outputs.tag }}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '.' }}"
            export IMAGE_TAG="${{ steps.meta.outputs.version }}"
            export DOCKERHUB_NAMESPACE="${{ env.DOCKERHUB_NAMESPACE }}"
            SERVICE="${{ steps.meta.outputs.service }}"
            if [ "$SERVICE" = "api" ] && docker compose --profile selfhosted config --services 2>/dev/null | grep -qx api-lite; then
              # Prefer whichever profile is active; try full first then lite
              if docker compose --profile selfhosted-full ps --services 2>/dev/null | grep -qx api; then
                docker compose --profile selfhosted-full pull api
                docker compose --profile selfhosted-full up -d api
              else
                docker compose --profile selfhosted pull api-lite
                docker compose --profile selfhosted up -d api-lite
              fi
            else
              docker compose --profile selfhosted-full --profile production pull "$SERVICE"
              docker compose --profile selfhosted-full --profile production up -d "$SERVICE"
            fi
