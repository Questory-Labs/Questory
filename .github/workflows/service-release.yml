name: Service Release

# Deploys / releases a service using an already-published Docker image.
#
# Triggers:
#   - Push tag: service-api-1.0.0, service-web-1.2.3 (version must match a prior docker-* release)
#   - Manual: Actions → Manual Release → Run workflow
on:
  push:
    tags:
      - "service-api-*"
      - "service-web-*"
  workflow_call:
    inputs:
      release_tag:
        description: Full release tag (e.g. service-api-1.2.3)
        required: true
        type: string
      channel_override:
        description: Channel override (auto, stable, rc, canary)
        required: false
        type: string
        default: auto

concurrency:
  group: service-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOCKERHUB_NAMESPACE: santoshpanna
  DOCKER_IMAGE_PREFIX: questorylabs

jobs:
  release:
    name: Release service from Docker image
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Parse tag
        id: meta
        env:
          CHANNEL_OVERRIDE: ${{ inputs.channel_override || 'auto' }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if [[ "$tag" =~ -(api|web)-canary$ ]]; then
            export CANARY_VERSION="canary.$(date -u +%Y%m%d).${GITHUB_SHA:0:7}"
            echo "Generated CANARY_VERSION=${CANARY_VERSION}"
          fi
          node scripts/ci-parse-tag.mjs "${tag}"

      - name: Docker Buildx cache
        uses: ./.github/actions/docker-buildx-cache

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify image exists
        run: |
          set -euo pipefail
          echo "Pulling ${{ steps.meta.outputs.image_tag }}"
          docker pull "${{ steps.meta.outputs.image_tag }}"
          if [ -n "${{ steps.meta.outputs.image_latest }}" ]; then
            echo "Also available as latest:"
            docker pull "${{ steps.meta.outputs.image_latest }}" || true
          elif [ -n "${{ steps.meta.outputs.channel }}" ]; then
            echo "Also available on channel tag:"
            docker pull "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}" || true
          fi
          docker image inspect "${{ steps.meta.outputs.image_tag }}" --format '{{.Id}} {{.RepoTags}}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Service ${{ steps.meta.outputs.service }} ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          body: |
            ## Service release

            Uses the published Docker image (no rebuild).

            | | |
            |---|---|
            | Service | `${{ steps.meta.outputs.service }}` |
            | Channel | `${{ steps.meta.outputs.channel }}` |
            | Version | `${{ steps.meta.outputs.version }}` |
            | Image | `${{ steps.meta.outputs.image_tag }}` |

            ### Compose deploy

            Pin a version:
            ```bash
            export IMAGE_TAG=${{ steps.meta.outputs.version }}
            docker compose --profile selfhosted-full pull ${{ steps.meta.outputs.service }}
            docker compose --profile selfhosted-full up -d ${{ steps.meta.outputs.service }}
            ```

            Follow a channel (`stable`, `rc`, or `canary`):
            ```bash
            export IMAGE_TAG=${{ steps.meta.outputs.channel }}
            docker compose --profile selfhosted-full pull ${{ steps.meta.outputs.service }}
            docker compose --profile selfhosted-full up -d ${{ steps.meta.outputs.service }}
            ```

            For lite (`api` → `api-lite`):
            ```bash
            export IMAGE_TAG=${{ steps.meta.outputs.version }}
            docker compose --profile selfhosted pull api-lite
            docker compose --profile selfhosted up -d api-lite
            ```

  deploy:
    name: Remote deploy
    needs: release
    runs-on: self-hosted
    if: ${{ vars.ENABLE_SERVICE_DEPLOY == 'true' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Parse tag
        id: meta
        env:
          CHANNEL_OVERRIDE: ${{ inputs.channel_override || 'auto' }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if [[ "$tag" =~ -(api|web)-canary$ ]]; then
            export CANARY_VERSION="canary.$(date -u +%Y%m%d).${GITHUB_SHA:0:7}"
          fi
          node scripts/ci-parse-tag.mjs "${tag}"

      - name: Deploy over SSH 
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH || '.' }}"
            export IMAGE_TAG="${{ steps.meta.outputs.version }}"
            export DOCKERHUB_NAMESPACE="${{ env.DOCKERHUB_NAMESPACE }}"
            SERVICE="${{ steps.meta.outputs.service }}"
            if [ "$SERVICE" = "api" ] && docker compose --profile selfhosted config --services 2>/dev/null | grep -qx api-lite; then
              # Prefer whichever profile is active; try full first then lite
              if docker compose --profile selfhosted-full ps --services 2>/dev/null | grep -qx api; then
                docker compose --profile selfhosted-full pull api
                docker compose --profile selfhosted-full up -d api
              else
                docker compose --profile selfhosted pull api-lite
                docker compose --profile selfhosted up -d api-lite
              fi
            else
              docker compose --profile selfhosted-full --profile production pull "$SERVICE"
              docker compose --profile selfhosted-full --profile production up -d "$SERVICE"
            fi
