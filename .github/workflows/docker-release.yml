name: Docker Release

# Community images only (api / web). QEngine is released from the private
# Questory-Labs/QEngine repo (tag docker-qengine-*); binary-only, no source in image.
#
# Triggers:
#   - Push tag: docker-api-1.0.0 (stable), docker-web-1.3.0-rc.1 (rc), docker-api-canary
#   - Manual: Actions → Manual Release → Run workflow
on:
  push:
    tags:
      - "docker-api-*"
      - "docker-web-*"
  workflow_call:
    inputs:
      release_tag:
        description: Full release tag (e.g. docker-api-1.2.3)
        required: true
        type: string
      channel_override:
        description: Channel override (auto, stable, rc, canary)
        required: false
        type: string
        default: auto
      skip_github_release:
        description: Skip creating a GitHub Release (used by canary automation)
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_NAMESPACE: santoshpanna
  DOCKER_IMAGE_PREFIX: questorylabs
  GHCR_NAMESPACE: questory-labs

jobs:
  meta:
    name: Parse tag
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      service: ${{ steps.meta.outputs.service }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      package: ${{ steps.meta.outputs.package }}
      image: ${{ steps.meta.outputs.image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_tags: ${{ steps.meta.outputs.image_tags }}
      image_extra_tags: ${{ steps.meta.outputs.image_extra_tags }}
      image_latest: ${{ steps.meta.outputs.image_latest }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
      ghcr_image_tag: ${{ steps.meta.outputs.ghcr_image_tag }}
      ghcr_image_tags: ${{ steps.meta.outputs.ghcr_image_tags }}
      ghcr_image_extra_tags: ${{ steps.meta.outputs.ghcr_image_extra_tags }}
      ghcr_image_latest: ${{ steps.meta.outputs.ghcr_image_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"

      - name: Parse tag
        id: meta
        env:
          CHANNEL_OVERRIDE: ${{ inputs.channel_override || 'auto' }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if [[ "$tag" =~ -(api|web)-canary$ ]]; then
            export CANARY_VERSION="0.0.0-canary.$(date -u +%Y%m%d).${GITHUB_SHA:0:7}"
            echo "Generated CANARY_VERSION=${CANARY_VERSION}"
          fi
          node scripts/ci-parse-tag.mjs "${tag}"

  test-shared:
    name: Test shared
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared
        run: pnpm --filter @questorylabs/shared build

      - name: Detect tests
        id: detect
        run: |
          if node scripts/ci-has-tests.mjs shared; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test script for shared — skipping."
          fi

      - name: Run shared tests
        if: steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter @questorylabs/shared test

  test-service:
    name: Test ${{ needs.meta.outputs.service }}
    needs: [meta, test-shared]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-playwright: ${{ needs.meta.outputs.service == 'web' && 'true' || 'false' }}

      - name: Build shared
        run: pnpm --filter @questorylabs/shared build

      - name: Generate Prisma client
        if: needs.meta.outputs.service == 'api'
        run: pnpm db:generate
        env:
          DATABASE_URL: file:./test.db
          DATABASE_PROVIDER: sqlite

      - name: Detect tests
        id: detect
        run: |
          if node scripts/ci-has-tests.mjs "${{ needs.meta.outputs.service }}"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test script for ${{ needs.meta.outputs.service }} — skipping."
          fi

      - name: Install Playwright browsers
        if: needs.meta.outputs.service == 'web' && steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter @questorylabs/web exec playwright install --with-deps chromium

      - name: Run unit tests
        if: steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter "${{ needs.meta.outputs.package }}" test
        env:
          APP_MODE: local
          SESSION_SECRET: test-session-secret-32chars!!
          DATABASE_URL: file:./test.db
          DATABASE_PROVIDER: sqlite

      - name: Run Playwright e2e
        if: needs.meta.outputs.service == 'web' && steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter @questorylabs/web test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_ENABLE_MUSIC: "false"
          NEXT_PUBLIC_ENABLE_WATCH: "false"

  release:
    name: Build & push Docker image
    needs: [meta, test-service]
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/setup
        with:
          install: "false"

      - name: Docker Buildx cache
        uses: ./.github/actions/docker-buildx-cache

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ needs.meta.outputs.version }}
          IMAGE_EXTRA_TAGS: ${{ needs.meta.outputs.image_extra_tags }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          DOCKER_IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
          node scripts/docker-publish.mjs "${{ needs.meta.outputs.service }}"

      - name: Make Docker Hub image public
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ env.DOCKER_IMAGE_PREFIX }}-${{ needs.meta.outputs.service }}
        run: |
          set -euo pipefail
          # Current Hub API: exchange username+PAT for a Bearer JWT, then PATCH.
          # Legacy "Authorization: JWT" + /users/login often returns 403 for PATs.
          login="$(curl -fsS -H "Content-Type: application/json" \
            -X POST \
            -d "{\"identifier\":\"${DOCKERHUB_USERNAME}\",\"secret\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/auth/token)"
          token="$(printf '%s' "$login" | jq -r '.access_token // .token // empty')"
          if [ -z "$token" ]; then
            echo "Failed to obtain Docker Hub access token"
            printf '%s' "$login" | jq -c '{error,detail,message}' 2>/dev/null || printf '%s\n' "$login"
            exit 1
          fi
          url="https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${REPO}/"
          # Fallback to legacy path if namespaces route is missing for this account.
          code="$(curl -sS -o /tmp/dh-public.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d '{"is_private":false}' \
            "$url")"
          if [ "$code" = "404" ]; then
            url="https://hub.docker.com/v2/repositories/${DOCKERHUB_NAMESPACE}/${REPO}/"
            code="$(curl -sS -o /tmp/dh-public.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              -d '{"is_private":false}' \
              "$url")"
          fi
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "Docker Hub visibility PATCH failed (HTTP ${code}) for ${DOCKERHUB_NAMESPACE}/${REPO}"
            echo "Ensure DOCKERHUB_USERNAME owns that namespace and the PAT has Read, Write, Delete."
            cat /tmp/dh-public.json || true
            exit 1
          fi
          echo "Docker Hub ${DOCKERHUB_NAMESPACE}/${REPO} set to public"

      - name: Create GitHub Release
        if: ${{ inputs.skip_github_release != true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Docker ${{ needs.meta.outputs.service }} ${{ needs.meta.outputs.version }} (${{ needs.meta.outputs.channel }})
          generate_release_notes: true
          body: |
            ## Docker image

            | | |
            |---|---|
            | Service | `${{ needs.meta.outputs.service }}` |
            | Channel | `${{ needs.meta.outputs.channel }}` |
            | Version | `${{ needs.meta.outputs.version }}` |
            | Docker Hub tags | `${{ needs.meta.outputs.image_tags }}` |
            | GHCR tags | `${{ needs.meta.outputs.ghcr_image_tags }}` |

            Pull by version (Docker Hub):
            ```bash
            docker pull ${{ needs.meta.outputs.image_tag }}
            ```

            Pull by channel (Docker Hub):
            ```bash
            docker pull ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.channel }}
            ```

            Pull by version (GHCR):
            ```bash
            docker pull ${{ needs.meta.outputs.ghcr_image_tag }}
            ```

            Pull by channel (GHCR):
            ```bash
            docker pull ${{ needs.meta.outputs.ghcr_image }}:${{ needs.meta.outputs.channel }}
            ```

            Deploy this version with a service tag:
            ```bash
            git tag service-${{ needs.meta.outputs.service }}-${{ needs.meta.outputs.version }}
            git push origin service-${{ needs.meta.outputs.service }}-${{ needs.meta.outputs.version }}
            ```
