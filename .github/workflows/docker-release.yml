name: Docker Release

# Community images only (api / web). QEngine is released from the private
# Questory-Labs/QEngine repo (tag docker-qengine-*); binary-only, no source in image.
#
# Tag examples:
#   docker-api-1.0.0
#   docker-web-1.2.3
on:
  push:
    tags:
      - "docker-api-*"
      - "docker-web-*"

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_NAMESPACE: santoshpanna
  DOCKER_IMAGE_PREFIX: questorylabs
  GHCR_NAMESPACE: questory-labs

jobs:
  release:
    name: Build & push Docker image
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Parse tag
        id: meta
        run: node scripts/ci-parse-tag.mjs "${{ github.ref_name }}"

      - name: Build shared
        run: pnpm --filter @questorylabs/shared build

      - name: Generate Prisma client
        if: steps.meta.outputs.service == 'api'
        run: pnpm db:generate
        env:
          DATABASE_URL: file:./test.db
          DATABASE_PROVIDER: sqlite

      - name: Detect tests
        id: detect
        run: |
          if node scripts/ci-has-tests.mjs "${{ steps.meta.outputs.service }}"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test script for ${{ steps.meta.outputs.service }} — skipping tests."
          fi

      - name: Run tests
        if: steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter "${{ steps.meta.outputs.package }}" test
        env:
          APP_MODE: local
          SESSION_SECRET: test-session-secret-32chars!!
          DATABASE_URL: file:./test.db
          DATABASE_PROVIDER: sqlite

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          DOCKER_IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
          node scripts/docker-publish.mjs "${{ steps.meta.outputs.service }}"

      - name: Make Docker Hub image public
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ env.DOCKER_IMAGE_PREFIX }}-${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          # Current Hub API: exchange username+PAT for a Bearer JWT, then PATCH.
          # Legacy "Authorization: JWT" + /users/login often returns 403 for PATs.
          login="$(curl -fsS -H "Content-Type: application/json" \
            -X POST \
            -d "{\"identifier\":\"${DOCKERHUB_USERNAME}\",\"secret\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/auth/token)"
          token="$(printf '%s' "$login" | jq -r '.access_token // .token // empty')"
          if [ -z "$token" ]; then
            echo "Failed to obtain Docker Hub access token"
            printf '%s\n' "$login" | jq -c '{error,detail,message}' 2>/dev/null || printf '%s\n' "$login"
            exit 1
          fi
          url="https://hub.docker.com/v2/namespaces/${DOCKERHUB_NAMESPACE}/repositories/${REPO}/"
          # Fallback to legacy path if namespaces route is missing for this account.
          code="$(curl -sS -o /tmp/dh-public.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d '{"is_private":false}' \
            "$url")"
          if [ "$code" = "404" ]; then
            url="https://hub.docker.com/v2/repositories/${DOCKERHUB_NAMESPACE}/${REPO}/"
            code="$(curl -sS -o /tmp/dh-public.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              -d '{"is_private":false}' \
              "$url")"
          fi
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "Docker Hub visibility PATCH failed (HTTP ${code}) for ${DOCKERHUB_NAMESPACE}/${REPO}"
            echo "Ensure DOCKERHUB_USERNAME owns that namespace and the PAT has Read, Write, Delete."
            cat /tmp/dh-public.json || true
            exit 1
          fi
          echo "Docker Hub ${DOCKERHUB_NAMESPACE}/${REPO} set to public"

      - name: Ensure GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version | head -1
            exit 0
          fi
          # GitHub-hosted images ship gh; self-hosted runners usually do not.
          ver="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "Unsupported arch: $arch"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz" \
            | tar -xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "/tmp/gh_${ver}_linux_${arch}/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          gh --version | head -1

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ env.DOCKER_IMAGE_PREFIX }}-${{ steps.meta.outputs.service }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            "orgs/${GHCR_NAMESPACE}/packages/container/${PKG}/visibility" \
            -f visibility=public
          echo "GHCR package ghcr.io/${GHCR_NAMESPACE}/${PKG} set to public"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Docker ${{ steps.meta.outputs.service }} ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          body: |
            ## Docker image

            | | |
            |---|---|
            | Service | `${{ steps.meta.outputs.service }}` |
            | Version | `${{ steps.meta.outputs.version }}` |
            | Docker Hub | `${{ steps.meta.outputs.image_tag }}` |
            | Docker Hub (latest) | `${{ steps.meta.outputs.image_latest }}` |
            | GHCR | `${{ steps.meta.outputs.ghcr_image_tag }}` |
            | GHCR (latest) | `${{ steps.meta.outputs.ghcr_image_latest }}` |

            Pull (Docker Hub):
            ```bash
            docker pull ${{ steps.meta.outputs.image_tag }}
            ```

            Pull (GHCR):
            ```bash
            docker pull ${{ steps.meta.outputs.ghcr_image_tag }}
            ```

            Deploy this version with a service tag:
            ```bash
            git tag service-${{ steps.meta.outputs.service }}-${{ steps.meta.outputs.version }}
            git push origin service-${{ steps.meta.outputs.service }}-${{ steps.meta.outputs.version }}
            ```
