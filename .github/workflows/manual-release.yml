name: Manual Release



# Single entry point for manual releases from the Actions UI.

# Actions → Manual Release → Run workflow

on:

  workflow_dispatch:

    inputs:

      release_type:

        description: Release pipeline

        required: true

        type: choice

        options:

          - docker

          - service

      service:

        description: Service to release

        required: true

        type: choice

        options:

          - api

          - web

      channel:

        description: Release channel (auto infers from semver)

        required: true

        type: choice

        options:

          - auto

          - stable

          - rc

          - canary

      version:

        description: Version (e.g. v1.2.3, v1.3.0-rc.1, v1.3.0-canary.3). Use "canary" with channel=canary to auto-resolve the next canary build.

        required: true

        type: string



concurrency:

  group: manual-release-${{ inputs.release_type }}-${{ inputs.service }}-${{ inputs.version }}-${{ inputs.channel }}

  cancel-in-progress: false



permissions:

  contents: write

  packages: write



jobs:

  meta:

    name: Resolve release tag

    runs-on: ubuntu-latest

    outputs:

      release_tag: ${{ steps.tag.outputs.release_tag }}

      channel_override: ${{ steps.tag.outputs.channel_override }}

    steps:

      - name: Checkout

        uses: actions/checkout@v7

        with:

          fetch-depth: 0



      - name: Setup Node

        uses: ./.github/actions/setup

        with:

          install: "false"



      - name: Build release tag

        id: tag

        run: |

          set -euo pipefail

          version="${{ inputs.version }}"

          version="${version#v}"

          channel="${{ inputs.channel }}"

          release_type="${{ inputs.release_type }}"

          service="${{ inputs.service }}"



          if [ "$channel" = "canary" ] && { [ -z "$version" ] || [ "$version" = "canary" ]; }; then

            git fetch --tags --force

            resolved="$(node scripts/release-version.mjs canary)"

            if [ "$service" = "api" ]; then

              release_tag="$(printf '%s\n' "$resolved" | awk -F= '/^docker_tag_api=/{print $2}')"

            else

              release_tag="$(printf '%s\n' "$resolved" | awk -F= '/^docker_tag_web=/{print $2}')"

            fi

            channel="canary"

          else

            if [ -z "$version" ] || [ "$version" = "canary" ]; then

              echo "version is required unless channel=canary with version=canary"

              exit 1

            fi

            release_tag="${release_type}-${service}-${version}"

          fi



          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

          echo "channel_override=${channel}" >> "$GITHUB_OUTPUT"

          echo "Release tag: ${release_tag}"



  docker:

    name: Docker release

    needs: meta

    if: inputs.release_type == 'docker'

    uses: ./.github/workflows/docker-release.yml

    with:

      release_tag: ${{ needs.meta.outputs.release_tag }}

      channel_override: ${{ needs.meta.outputs.channel_override }}

    secrets: inherit



  service:

    name: Service release

    needs: meta

    if: inputs.release_type == 'service'

    uses: ./.github/workflows/service-release.yml

    with:

      release_tag: ${{ needs.meta.outputs.release_tag }}

      channel_override: ${{ needs.meta.outputs.channel_override }}

    secrets: inherit


