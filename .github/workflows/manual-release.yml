name: Manual Release

# Single entry point for manual releases from the Actions UI.
# Actions → Manual Release → Run workflow
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release pipeline
        required: true
        type: choice
        options:
          - docker
          - service
      service:
        description: Service to release
        required: true
        type: choice
        options:
          - api
          - web
      version:
        description: Version (semver, e.g. 1.2.3)
        required: true
        type: string

concurrency:
  group: manual-release-${{ inputs.release_type }}-${{ inputs.service }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Build release tag
        id: tag
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          echo "release_tag=${{ inputs.release_type }}-${{ inputs.service }}-${version}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${{ inputs.release_type }}-${{ inputs.service }}-${version}"

  docker:
    name: Docker release
    needs: meta
    if: inputs.release_type == 'docker'
    uses: ./.github/workflows/docker-release.yml
    with:
      release_tag: ${{ needs.meta.outputs.release_tag }}
    secrets: inherit

  service:
    name: Service release
    needs: meta
    if: inputs.release_type == 'service'
    uses: ./.github/workflows/service-release.yml
    with:
      release_tag: ${{ needs.meta.outputs.release_tag }}
    secrets: inherit
