name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, cron]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared
        run: pnpm --filter @questorylabs/shared build

      - name: Detect tests
        id: detect
        run: |
          if node scripts/ci-has-tests.mjs "${{ matrix.service }}"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test script for ${{ matrix.service }} — skipping."
          fi

      - name: Run tests
        if: steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter "@questorylabs/${{ matrix.service }}" test
