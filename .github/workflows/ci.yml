name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, shared]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache-playwright: ${{ matrix.service == 'web' && 'true' || 'false' }}

      - name: Build shared
        run: pnpm --filter @questorylabs/shared build

      - name: Generate Prisma client
        if: matrix.service == 'api'
        run: pnpm db:generate
        env:
          DATABASE_URL: file:./test.db
          DATABASE_PROVIDER: sqlite

      - name: Detect tests
        id: detect
        run: |
          if node scripts/ci-has-tests.mjs "${{ matrix.service }}"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test script for ${{ matrix.service }} — skipping."
          fi

      - name: Install Playwright browsers
        if: matrix.service == 'web' && steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter @questorylabs/web exec playwright install --with-deps chromium

      - name: Run unit tests
        if: steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter "@questorylabs/${{ matrix.service }}" test
        env:
          APP_MODE: local
          SESSION_SECRET: test-session-secret-32chars!!
          DATABASE_URL: file:./test.db
          DATABASE_PROVIDER: sqlite

      - name: Run Playwright e2e
        if: matrix.service == 'web' && steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter @questorylabs/web test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_ENABLE_MUSIC: "false"
          NEXT_PUBLIC_ENABLE_WATCH: "false"
