name: Docker Buildx cache
description: Ensure buildx is ready and export cache directory paths for image builds
outputs:
  cache-root:
    description: Root directory for per-service buildx local caches
    value: ${{ steps.paths.outputs.cache_root }}
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Resolve cache paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        tool_cache="${RUNNER_TOOL_CACHE:-/tmp/gha-tool-cache}"
        cache_root="${DOCKER_BUILDX_CACHE_DIR:-${tool_cache}/docker-buildx}"
        mkdir -p "${cache_root}"
        echo "cache_root=${cache_root}" >> "${GITHUB_OUTPUT}"
        echo "DOCKER_BUILDX_CACHE_DIR=${cache_root}" >> "${GITHUB_ENV}"
        echo "Docker buildx cache root: ${cache_root}"
