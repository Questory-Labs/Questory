# Full Questory stack + QEngine (binary-only).
# Requires pgvector Postgres + Redis. Music / Watch / Read / Enterprise all on.
# QEngine image: personal / noncommercial. Commercial use needs a separate license.
#
#   cp .env.enterprise.example .env
#   # set SESSION_SECRET, STEAM_API_KEY, …
#   docker compose -f docker-compose.enterprise.yml --env-file .env up -d --build

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  args:
    DATABASE_PROVIDER: postgresql

# Shared by API + QEngine (same SESSION_SECRET required for session cookies)
x-shared-env: &shared-env
  SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
  DATABASE_URL: ${DATABASE_URL:-postgresql://questorylabs:questorylabs@postgres:5432/questorylabs}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  TMDB_API_KEY: ${TMDB_API_KEY:-}

x-api-env: &api-env
  <<: *shared-env
  STEAM_API_KEY: ${STEAM_API_KEY:-}
  STEAM_REALM: ${STEAM_REALM:-http://localhost:4000}
  STEAM_RETURN_URL: ${STEAM_RETURN_URL:-http://localhost:4000/auth/steam/callback}
  API_PORT: 4000
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  ALLOWED_STEAM_IDS: ${ALLOWED_STEAM_IDS:-}
  ITAD_API_KEY: ${ITAD_API_KEY:-}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
  MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-}
  TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
  TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
  TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI:-http://localhost:4000/v1/watch/trakt/callback}
  ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
  ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
  ANILIST_REDIRECT_URI: ${ANILIST_REDIRECT_URI:-http://localhost:4000/v1/watch/anilist/callback}
  CRON_SECRET: ${CRON_SECRET:-}
  CRON_ENABLED: ${CRON_ENABLED:-true}
  CRON_DAILY_SCHEDULE: ${CRON_DAILY_SCHEDULE:-0 3 * * *}
  CRON_RECOVERY_SCHEDULE: ${CRON_RECOVERY_SCHEDULE:-*/15 * * * *}
  CRON_WATCH_SCHEDULE: ${CRON_WATCH_SCHEDULE:-0 */6 * * *}
  CRON_CATALOG_SCHEDULE: ${CRON_CATALOG_SCHEDULE:-0 4 * * *}
  APP_MODE: ${APP_MODE:-selfhosted-full}
  DATABASE_PROVIDER: postgresql
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  USE_INLINE_SYNC: "false"

x-enterprise-env: &enterprise-env
  <<: *shared-env
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

  ENTERPRISE_PORT: "4030"
  ENTERPRISE_DATA_DIR: /data
  ENTERPRISE_STORE: ${ENTERPRISE_STORE:-postgres}

  ENTERPRISE_ML: ${ENTERPRISE_ML:-on}
  ENTERPRISE_EMBED_PROVIDER: ${ENTERPRISE_EMBED_PROVIDER:-auto}
  ENTERPRISE_EMBED_MODEL: ${ENTERPRISE_EMBED_MODEL:-nomic-embed-text}

  ENTERPRISE_LLM: ${ENTERPRISE_LLM:-on}
  ENTERPRISE_OLLAMA_URL: ${ENTERPRISE_OLLAMA_URL:-http://host.docker.internal:11434}
  ENTERPRISE_LLM_MODEL: ${ENTERPRISE_LLM_MODEL:-llama3.1:8b}
  ENTERPRISE_LLM_PULL: ${ENTERPRISE_LLM_PULL:-on}
  ENTERPRISE_STAGE_TIMEOUT_MS: ${ENTERPRISE_STAGE_TIMEOUT_MS:-30000}

  ENTERPRISE_WORLD: ${ENTERPRISE_WORLD:-on}
  ENTERPRISE_BRAVE_API_KEY: ${ENTERPRISE_BRAVE_API_KEY:-}
  ENTERPRISE_BRAVE_BUDGET: ${ENTERPRISE_BRAVE_BUDGET:-1500}

  OTEL_API_PORT: "4040"
  OTEL_HTTP_PORT: "4318"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4318}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-qengine}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-questorylabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questorylabs}
      POSTGRES_DB: ${POSTGRES_DB:-questorylabs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${DOCKERHUB_NAMESPACE:-santoshpanna}/questorylabs-api:${IMAGE_TAG:-latest}
    build: *api-build
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    image: ${DOCKERHUB_NAMESPACE:-santoshpanna}/questorylabs-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_ENABLE_MUSIC: ${NEXT_PUBLIC_ENABLE_MUSIC:-true}
        NEXT_PUBLIC_ENABLE_WATCH: ${NEXT_PUBLIC_ENABLE_WATCH:-true}
        NEXT_PUBLIC_ENABLE_READ: ${NEXT_PUBLIC_ENABLE_READ:-true}
        ENTERPRISE: ${ENTERPRISE:-true}
        NEXT_PUBLIC_ENTERPRISE_URL: ${NEXT_PUBLIC_ENTERPRISE_URL:-http://localhost:4030}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      - api
      - enterprise
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_ENABLE_MUSIC: ${NEXT_PUBLIC_ENABLE_MUSIC:-true}
      NEXT_PUBLIC_ENABLE_WATCH: ${NEXT_PUBLIC_ENABLE_WATCH:-true}
      NEXT_PUBLIC_ENABLE_READ: ${NEXT_PUBLIC_ENABLE_READ:-true}
      ENTERPRISE: ${ENTERPRISE:-true}
      NEXT_PUBLIC_ENTERPRISE_URL: ${NEXT_PUBLIC_ENTERPRISE_URL:-http://localhost:4030}
    ports:
      - "${WEB_PORT:-3000}:3000"

  enterprise:
    image: ${QENGINE_IMAGE:-santoshpanna/questorylabs-qengine:latest}
    pull_policy: ${QENGINE_PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ENTERPRISE_PORT:-4030}:4030"
      - "${OTEL_API_PORT:-4040}:4040"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - enterprise_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *enterprise-env

volumes:
  postgres_data:
  redis_data:
  enterprise_data:
