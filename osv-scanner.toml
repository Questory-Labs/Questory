# OSV Scanner configuration for pnpm-lock.yaml
# https://google.github.io/osv-scanner/configuration/

# brace-expansion is pinned via pnpm overrides (per major) to the patched releases for
# GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr and GHSA-qhr7-859c-m2p7:
#   1.1.21 / 2.1.7 / 5.0.12  (see root package.json "pnpm.overrides").
# minimatch@3 (Nest CLI build tooling) requires the v1 callable CommonJS API, so we
# cannot collapse every consumer onto brace-expansion@5 — hence one override per line.
# No OSV ignore is required once the override resolves to those versions.

# stream-json 1.9.1 — @crawlee/core@3.17.0 pins the CommonJS 1.x line.
# All three advisories ship their fix in stream-json 3.6.0, an ESM-only major, so an
# override would break Steam store crawling. We also do not exercise the vulnerable
# paths, and upstream's scope note is that stream-json's documented input is
# operator-owned data (exports, dumps, logs) rather than untrusted network JSON — the
# attack vector is local:
#   * GHSA-528h-pc64-c93x — pick/ignore/filter path filters (unused).
#   * GHSA-hqr4-qq8f-hg3x — JSONC comment scanner (unused).
#   * GHSA-mjw6-4jj6-33hc — Assembler prototype pollution.
[[IgnoredVulns]]
id = "GHSA-528h-pc64-c93x"
ignoreUntil = 2027-04-15
reason = "Crawlee pins stream-json 1.x CJS; fix is the ESM-only 3.6.0 major. Path-filter DoS is unused; input is operator-owned."

[[IgnoredVulns]]
id = "GHSA-hqr4-qq8f-hg3x"
ignoreUntil = 2027-04-15
reason = "JSONC comment-rescan DoS. Same ESM-only 3.6.0 fix; JSONC entry points are unused and input is operator-owned."

[[IgnoredVulns]]
id = "GHSA-mjw6-4jj6-33hc"
ignoreUntil = 2027-04-15
reason = "Assembler prototype pollution. Same ESM-only 3.6.0 fix; input is operator-owned, not untrusted network JSON."
